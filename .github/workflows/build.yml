name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "images/**"
      - "shared/**"
      - ".github/workflows/build.yml"
  # On a pull request only the contract tests run - see the guard on the
  # publishing jobs below. Without this the tests first ran after the merge,
  # which is the wrong end of the review: a PR could sit approved for days with
  # nothing having checked it.
  pull_request:
    paths:
      - "images/**"
      - "shared/**"
      - ".github/workflows/build.yml"
  schedule:
    # Weekly refresh to pick up base-image patches.
    - cron: "0 5 * * 1"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The contract tests take seconds and cover the two helpers every image
  # depends on: the launch-line assembler and the Unreal tuple rewriter. Both
  # have already shipped a bug that only surfaced on a customer's server, so
  # nothing gets built until they pass.
  test:
    name: "shell contract tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: shared/launch.test.sh
        run: bash shared/launch.test.sh

      - name: shared/unrealini.test.sh
        run: bash shared/unrealini.test.sh

      - name: shared/workshop.test.sh
        run: bash shared/workshop.test.sh

      - name: shared/steam-update.test.sh
        run: bash shared/steam-update.test.sh

      - name: shared/jsonconf.test.sh
        run: bash shared/jsonconf.test.sh

      - name: shared/kvconf.test.sh
        run: bash shared/kvconf.test.sh

      - name: shared/cvarconf.test.sh
        run: bash shared/cvarconf.test.sh

      - name: shared/identity.test.sh
        run: bash shared/identity.test.sh

      - name: shared/cfgconf.test.sh
        run: bash shared/cfgconf.test.sh

      - name: shared/xmlprop.test.sh
        run: bash shared/xmlprop.test.sh

  # steamcmd_base builds on its own rather than as one leg of the big matrix.
  # The nine game images are FROM it, so they used to wait on `needs: build` -
  # the whole 19-tag matrix, java_26_ea and a Docker Hub timeout included. One
  # flaky leg then skipped every game image, which is exactly how a Palworld and
  # Zomboid fix sat unbuilt while the tag it needed was already published.
  #
  # Every publishing job below is skipped on a pull request. The tags they write
  # are mutable and are what the nodes pull - :zomboid is the image a live
  # server starts from - so building a PR would put unreviewed code on customer
  # servers the moment the branch was pushed, merge or no merge.
  base:
    name: "steamcmd_base"
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./images/steamcmd-base/Dockerfile
          # SteamCMD itself is a 32-bit x86 binary.
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: |
            ghcr.io/pterohost/pterodactyl-images:steamcmd_base
            ghcr.io/pterohost/pterodactyl-images:steamcmd_base-${{ github.sha }}
          cache-from: type=gha,scope=steamcmd_base
          cache-to: type=gha,mode=max,scope=steamcmd_base
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.url=https://github.com/Pterohost/pterodactyl-images

  build:
    name: "${{ matrix.tag }}"
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: java_7
            dir: java-7
          - tag: java_8
            dir: java-8
          - tag: java_11
            dir: java-11
          - tag: java_16
            dir: java-16
          - tag: java_17
            dir: java-17
          - tag: java_17_graalvm
            dir: java-17-graalvm
          - tag: java_18
            dir: java-18
          - tag: java_21
            dir: java-21
          - tag: java_21_graalvm
            dir: java-21-graalvm
          - tag: java_24
            dir: java-24
          - tag: java_24_graalvm
            dir: java-24-graalvm
          - tag: java_25
            dir: java-25
          - tag: java_25_graalvm
            dir: java-25-graalvm
          - tag: java_26_ea
            dir: java-26-ea
          - tag: sbox
            dir: sbox
            # s&box's native Linux dedicated server is x86-64 only.
            platforms: linux/amd64
          - tag: rust
            dir: rust
            # RustDedicated ships no arm64 depot.
            platforms: linux/amd64
          - tag: palworld_proton
            dir: palworld-proton
            # Same game and the same start-palworld bootstrap as the `palworld`
            # tag, but on the Windows depot under GE-Proton so RE-UE4SS mods
            # load. Here rather than in `derived` because GE-Proton needs
            # glibc >= 2.38 and the SteamCMD base is debian:12 (2.36), so this
            # one is FROM ubuntu:24.04 and does not wait on steamcmd_base.
            # The slowest leg in either matrix - the Proton tarball is 532 MB.
            platforms: linux/amd64
          - tag: source_proton
            dir: source-proton
            # Same start-source bootstrap as the `source` tag, but on the
            # Windows depot under GE-Proton. It exists for Left 4 Dead 2 alone:
            # Valve's appinfo for app 222860 has one launch entry, srcds.exe
            # with oslist "windows", and no common.oslist, so SteamCMD refuses
            # the Linux install outright. Here rather than in `derived` for the
            # same reason as palworld_proton - GE-Proton needs glibc >= 2.38 and
            # the SteamCMD base is debian:12.
            platforms: linux/amd64
          - tag: gmod_classic
            dir: gmod-classic
            # FROM the upstream Pterodactyl Source image, which is amd64 only.
            platforms: linux/amd64
          - tag: cs2
            dir: cs2
            # Built on the official Steam Runtime 3 (sniper) platform rather
            # than steamcmd_base - Valve builds CS2 against that runtime and
            # game/cs2.sh expects it.
            platforms: linux/amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./images/${{ matrix.dir }}/Dockerfile
          platforms: ${{ matrix.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          provenance: true
          sbom: true
          tags: |
            ghcr.io/pterohost/pterodactyl-images:${{ matrix.tag }}
            ghcr.io/pterohost/pterodactyl-images:${{ matrix.tag }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.url=https://github.com/Pterohost/pterodactyl-images

  # Images that are FROM ghcr.io/pterohost/pterodactyl-images:steamcmd_base, so
  # they can only start once that tag has been pushed - and nothing else.
  derived:
    name: "${{ matrix.tag }}"
    needs: base
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: zomboid
            dir: zomboid
          - tag: palworld
            dir: palworld
          - tag: gmod
            dir: gmod
          - tag: sevendaystodie
            dir: sevendaystodie
          - tag: valheim
            dir: valheim
          - tag: unturned
            dir: unturned
          - tag: satisfactory
            dir: satisfactory
          - tag: dayz
            dir: dayz
          - tag: arma3
            dir: arma3
          - tag: cs16
            dir: cs16
          - tag: barotrauma
            dir: barotrauma
          - tag: squad
            dir: squad
          - tag: steam_generic
            dir: steam-generic
          - tag: eco
            dir: eco
          - tag: starbound
            dir: starbound
          - tag: source
            dir: source
          - tag: terraria
            dir: terraria
          - tag: beammp
            dir: beammp
            # FROM yolks:debian - сервер BeamMP это один бинарь с GitHub,
            # SteamCMD ему не нужен.
          - tag: factorio
            dir: factorio
            # FROM yolks:debian - headless Factorio качается с factorio.com.
            # FROM yolks:dotnet_9, а не steamcmd_base: сервер Terraria и его
            # ядра ставятся не из Steam, а с terraria.org и GitHub.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./images/${{ matrix.dir }}/Dockerfile
          # The SteamCMD base is amd64 only, so everything on top of it is too.
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: |
            ghcr.io/pterohost/pterodactyl-images:${{ matrix.tag }}
            ghcr.io/pterohost/pterodactyl-images:${{ matrix.tag }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.url=https://github.com/Pterohost/pterodactyl-images

  runtime:
    name: "${{ matrix.tag }}"
    # needs `build`, not just `test`, because one matrix entry - runtime_java_21
    # - is FROM ghcr.io/pterohost/pterodactyl-images:java_21, which the `build`
    # job publishes. On `needs: test` the two ran concurrently, so this job
    # pulled whatever java_21 the PREVIOUS run had left in the registry: a fix
    # to the Java line reached runtime_java_21 one build late, every time, and
    # nothing failed to say so. Same class of bug the base/derived split above
    # was created to prevent; it was applied to steamcmd_base and missed here.
    #
    # The ten pelican-based runtimes do not need `build` and now wait on it.
    # That is the cheaper half of the trade: GitHub Actions has no
    # per-matrix-entry `needs`, and splitting one entry into its own job means a
    # second copy of the publish steps to keep in sync forever.
    needs: [test, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Один Dockerfile и один start-runtime на все рантаймы: различается
          # только базовый образ, поэтому bootstrap ботов и скриптов чинится в
          # одном месте, а не в десятке форков generic-eggs.
          - { tag: runtime_nodejs_24,  base: "ghcr.io/pelican-eggs/yolks:nodejs_24",  kind: node,    title: "Node.js 24" }
          - { tag: runtime_nodejs_22,  base: "ghcr.io/pelican-eggs/yolks:nodejs_22",  kind: node,    title: "Node.js 22 LTS" }
          - { tag: runtime_bun,        base: "ghcr.io/pelican-eggs/yolks:bun_latest", kind: bun,     title: "Bun" }
          - { tag: runtime_python_313, base: "ghcr.io/pelican-eggs/yolks:python_3.13", kind: python, title: "Python 3.13" }
          - { tag: runtime_python_312, base: "ghcr.io/pelican-eggs/yolks:python_3.12", kind: python, title: "Python 3.12" }
          - { tag: runtime_java_21,    base: "ghcr.io/pterohost/pterodactyl-images:java_21", kind: java, title: "Java 21 LTS" }
          - { tag: runtime_dotnet_9,   base: "ghcr.io/pelican-eggs/yolks:dotnet_9",   kind: dotnet,  title: ".NET 9" }
          - { tag: runtime_go_123,     base: "ghcr.io/pelican-eggs/yolks:go_1.23",    kind: go,      title: "Go 1.23" }
          - { tag: runtime_rust,       base: "ghcr.io/pelican-eggs/yolks:rust_latest", kind: rust,   title: "Rust" }
          - { tag: runtime_elixir,     base: "ghcr.io/pelican-eggs/yolks:elixir_latest", kind: elixir, title: "Elixir" }
          - { tag: runtime_dart,       base: "ghcr.io/pelican-eggs/yolks:dart_stable", kind: dart,   title: "Dart" }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./images/runtime/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
            RUNTIME_KIND=${{ matrix.kind }}
            RUNTIME_TITLE=${{ matrix.title }}
          tags: |
            ghcr.io/pterohost/pterodactyl-images:${{ matrix.tag }}
            ghcr.io/pterohost/pterodactyl-images:${{ matrix.tag }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.url=https://github.com/Pterohost/pterodactyl-images
